services:

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-metrics}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-metrics}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build: ./collector
    restart: unless-stopped
    ports:
      - "${COLLECTOR_PORT:-8001}:8001"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-metrics}
      POLL_INTERVAL: ${POLL_INTERVAL:-10}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-15}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/api/v1/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        ollama serve &
        sleep 10
        ollama pull ${OLLAMA_MODEL:-gemma3:4b}
      "

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analysis:
    build: ./analysis
    restart: unless-stopped
    ports:
      - "${ANALYSIS_PORT:-8003}:8003"
    volumes:
      - analysis_models:/app/models
    depends_on:
      collector:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  alerter:
    build: ./alerter
    restart: unless-stopped
    ports:
      - "${ALERTER_PORT:-8002}:8002"
    depends_on:
      postgresql:
        condition: service_healthy
      analysis:
        condition: service_healthy
    environment:
      DB_HOST: postgresql
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-monitoring}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/api/v1/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_POLL_INTERVAL: ${POLL_INTERVAL:-10}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - collector
      - alerter
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgresql_data:
  timescaledb_data:
  analysis_models:
  ollama_data:
